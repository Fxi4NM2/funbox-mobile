<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Funbox 戰鬥陀螺 56 組抽獎助手</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f4f5f7;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 14px;
  }
  .card {
    background: #fff;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 3px 16px rgba(0,0,0,.10);
    margin-bottom: 12px;
  }
  h1 {
    font-size: 23px;
    text-align: center;
    margin: 2px 0 6px;
  }
  .sub {
    text-align: center;
    color: #666;
    font-size: 14px;
    margin-bottom: 14px;
  }
  .progress {
    font-size: 24px;
    font-weight: 800;
    text-align: center;
    margin: 6px 0;
  }
  .current {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    background: #fff0a8;
    border-radius: 12px;
    padding: 11px;
    margin: 10px 0 14px;
  }
  button {
    width: 100%;
    border: 0;
    border-radius: 13px;
    padding: 14px 12px;
    margin: 5px 0;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .open { background: #222; color: #fff; }
  .done { background: #198754; color: #fff; }
  .next { background: #e9ecef; color: #222; }
  .reset { background: #f1f1f1; color: #555; font-size: 15px; }
  .nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .nav button { margin: 5px 0; }
  .list-title {
    font-weight: 800;
    margin-bottom: 8px;
  }
  .item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 12px;
    margin: 5px 0;
    border-radius: 10px;
    background: #f3f3f3;
    font-size: 15px;
  }
  .item.active { background: #fff0a8; font-weight: 800; }
  .item.done { background: #e7f6ed; color: #176b3a; }
  .item span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .hint {
    font-size: 13px;
    color: #666;
    line-height: 1.55;
    margin-top: 10px;
  }
  .small {
    font-size: 13px;
    color: #777;
    text-align: center;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h1>🎯 Funbox 戰鬥陀螺</h1>
    <div class="sub">手機一頁式・56 組連續抽獎助手</div>

    <div id="progress" class="progress">第 1 / 56 組</div>
    <div id="current" class="current">目前：UX-21</div>

    <button class="open" onclick="openCurrent()">🔗 開啟本次抽獎</button>
    <button class="done" onclick="completeAndNext()">✅ 完成這次，下一組</button>

    <div class="nav">
      <button class="next" onclick="go(-1)">⬅️ 上一組</button>
      <button class="next" onclick="go(1)">下一組 ➡️</button>
    </div>

    <button class="reset" onclick="resetAll()">🔄 從第 1 組重新開始</button>

    <div class="hint">
      使用方式：先按「開啟本次抽獎」，完成 LINE / Funbox 正常流程後，
      回到這個頁面，再按「完成這次，下一組」。
    </div>
  </div>

  <div class="card">
    <div class="list-title">📋 56 組抽獎清單</div>
    <div id="list"></div>
  </div>

</div>

];

const KEY = "funbox_mobile_56_index";
let index = Number(localStorage.getItem(KEY) || 0);

if (!Number.isInteger(index) || index < 0 || index >= TARGETS.length) index = 0;

function save() {
  localStorage.setItem(KEY, String(index));
}

function render() {
  document.getElementById("progress").textContent =
    `第 ${index + 1} / ${TARGETS.length} 組`;

  document.getElementById("current").textContent =
    `目前：${TARGETS[index].name}`;

  const list = document.getElementById("list");
  list.innerHTML = "";

  TARGETS.forEach((item, i) => {
    const row = document.createElement("div");
    row.className = "item";
    if (i === index) row.classList.add("active");
    if (i < index) row.classList.add("done");

    const status = i < index ? "✅" : (i === index ? "👉" : "○");

    row.innerHTML =
      `<span>${i + 1}. ${item.name}</span><span>${status}</span>`;

    row.onclick = () => {
      index = i;
      save();
      render();
      window.scrollTo({top:0, behavior:"smooth"});
    };

    list.appendChild(row);
  });
}

function openCurrent() {
  window.location.href = BASE + TARGETS[index].path;
}

function completeAndNext() {
  if (index >= TARGETS.length - 1) {
    alert("🎉 56 組全部完成！");
    return;
  }

  index++;
  save();
  render();

  // 直接開下一組 LIFF
  window.location.href = BASE + TARGETS[index].path;
}

function go(step) {
  const next = index + step;

  if (next < 0) {
    alert("目前已經是第 1 組");
    return;
  }

  if (next >= TARGETS.length) {
    alert("🎉 已經是第 56 組");
    return;
  }

  index = next;
  save();
  render();
}

function resetAll() {
  if (!confirm("確定要從第 1 組重新開始嗎？")) return;

  index = 0;
  save();
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
</html>
